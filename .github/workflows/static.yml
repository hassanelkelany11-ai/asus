  <div class="footer">MSRP USD is the fixed master price based on the original ASUS list at 55 EGP/USD. Hassan changes the exchange rate and MSRP EGP recalculates automatically. The selected exchange rate is saved on this browser.</div>
</div>

<script>
(async function(){
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT12gz1YKsEYFzkO5SkC2d6iI2-N06jxiQyRJVb_tqwY5edTsz-dZLmdE1e4azQ3xRUF8kqYs71xqNR/pub?gid=357708439&single=true&output=csv";
  const SLACK_WEBHOOK = "https://hooks.slack.com/services/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";
  const RATE_KEY="asus_monitor_usd_rate";

  const tbody=document.getElementById("tbody");
  const search=document.getElementById("search");
  const rate=document.getElementById("rate");
  const count=document.getElementById("count");
  const filtersBox=document.getElementById("filters");
  const sourceStatus=document.getElementById("sourceStatus");

  const qs=new URLSearchParams(location.search);
  const dealer=qs.get("dealer")||qs.get("ref");
  if(dealer) document.getElementById("dealer").textContent="Dealer: "+dealer;

  const savedRate=parseFloat(localStorage.getItem(RATE_KEY));
  if(savedRate>0) rate.value=savedRate;

  let active="All";
  let products=[];
  let rows=[];

  function cleanSize(v){
    const s=String(v??"").trim().replace(/"/g,"");
    if(!s) return "";
    if(/portable/i.test(s)) return "Portable";
    if(s==="14" || s==="15.6" || s==="16" || s==="17.3") return "Portable";
    if(["24","27","32","34"].includes(s)) return s+'"';
    return s.includes('"') ? s : s;
  }

  function parseCSV(csv){
    const out=[]; let row=[]; let cell=""; let q=false;
    for(let i=0;i<csv.length;i++){
      const c=csv[i], n=csv[i+1];
      if(q){
        if(c=='"' && n=='"'){ cell+='"'; i++; }
        else if(c=='"'){ q=false; }
        else cell+=c;
      }else{
        if(c=='"') q=true;
        else if(c==","){ row.push(cell); cell=""; }
        else if(c=="\n"){ row.push(cell); out.push(row); row=[]; cell=""; }
        else if(c!="\r") cell+=c;
      }
    }
    if(cell.length || row.length){ row.push(cell); out.push(row); }
    return out;
  }

  function moneyUSD(v){
    const n=parseFloat(String(v).replace(/[$,\s]/g,""));
    return Number.isFinite(n)?n:0;
  }

  function normalize(data){
    if(!data.length) return [];
    const headers=data[0].map(h=>String(h).trim().toLowerCase());
    const idx=(name)=>headers.indexOf(name);
    const im=idx("model"), isz=idx("size"), ipn=idx("part number"), iean=idx("ean"), iusd=idx("msrp usd");
    return data.slice(1).map(r=>({
      model:String(r[im]??"").trim(),
      size:cleanSize(r[isz]),
      part_number:String(r[ipn]??"").trim(),
      ean:String(r[iean]??"").trim(),
      usd:moneyUSD(r[iusd])
    })).filter(p=>p.model && p.usd>0);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function renderRows(){
    tbody.innerHTML=products.map((p,i)=>{
      const egp=p.usd*(parseFloat(rate.value)||55);
      return `<tr data-model="${esc(p.model)}" data-pn="${esc(p.part_number)}" data-ean="${esc(p.ean)}" data-size="${esc(p.size)}" data-usd="${p.usd}">
        <td class="rownum">${i+1}</td>
        <td class="modelCell">${esc(p.model)}</td>
        <td class="sizeCell">${esc(p.size)}</td>
        <td class="mono">${esc(p.part_number)}</td>
        <td class="mono">${esc(p.ean)}</td>
        <td class="price usd">$${p.usd.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
        <td class="price egp">EGP ${egp.toLocaleString("en-US",{maximumFractionDigits:0})}</td>
      </tr>`;
    }).join("");
    rows=[...tbody.querySelectorAll("tr")];
    bindRowTracking();
  }

  function renderFilters(){
    const order=["All","Portable",'24"','27"','32"','34"'];
    const counts={All:products.length};
    order.slice(1).forEach(s=>counts[s]=products.filter(p=>p.size===s).length);
    filtersBox.innerHTML=order.map(s=>`<button class="filter${s===active?" active":""}" data-filter="${esc(s)}">${esc(s)} <small>${counts[s]||0}</small></button>`).join("");
    [...filtersBox.querySelectorAll(".filter")].forEach(btn=>btn.addEventListener("click",()=>{
      active=btn.dataset.filter;
      [...filtersBox.querySelectorAll(".filter")].forEach(b=>b.classList.toggle("active",b===btn));
      apply();
    }));
  }

  function recalcPrices(){
    const rv=Math.max(parseFloat(rate.value)||55,0.01);
    rows.forEach(r=>{
      const usd=parseFloat(r.dataset.usd)||0;
      r.querySelector(".egp").textContent="EGP "+(usd*rv).toLocaleString("en-US",{maximumFractionDigits:0});
    });
  }

  function apply(){
    const q=(search.value||"").trim().toLowerCase();
    let shown=0;
    rows.forEach(r=>{
      const okSize=active==="All"||r.dataset.size===active;
      const hay=(r.dataset.model+" "+r.dataset.pn+" "+r.dataset.ean).toLowerCase();
      const okSearch=!q||hay.includes(q);
      const show=okSize&&okSearch;
      r.classList.toggle("hiddenRow",!show);
      if(show) shown++;
    });
    count.textContent=(q||active!=="All")?shown+" monitors found":shown+" monitors";
  }

  function sessionId(){
    let id=sessionStorage.getItem("asus_tracker_session");
    if(!id){
      id="s_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
      sessionStorage.setItem("asus_tracker_session",id);
    }
    return id;
  }

  async function track(eventType, details={}){
    const payload={
      text:"ASUS Monitor Tracker — "+eventType,
      blocks:[
        {type:"header",text:{type:"plain_text",text:"ASUS Monitor Tracker"}},
        {type:"section",fields:[
          {type:"mrkdwn",text:"*Event:*\n"+eventType},
          {type:"mrkdwn",text:"*Session:*\n"+sessionId()},
          {type:"mrkdwn",text:"*Dealer / Ref:*\n"+(dealer||"Anonymous")},
          {type:"mrkdwn",text:"*Time:*\n"+new Date().toLocaleString()}
        ]},
        {type:"section",text:{type:"mrkdwn",text:Object.entries(details).map(([k,v])=>"*"+k+":* "+v).join("\n")||"—"}}
      ]
    };
    try{
      await fetch(SLACK_WEBHOOK,{
        method:"POST",
        mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=UTF-8"},
        body:JSON.stringify(payload)
      });
    }catch(e){}
  }

  function bindRowTracking(){
    rows.forEach(r=>r.addEventListener("click",()=>{
      track("MONITOR VIEW",{
        model:r.dataset.model,
        part_number:r.dataset.pn,
        ean:r.dataset.ean,
        size:r.dataset.size,
        usd:r.querySelector(".usd").textContent,
        egp:r.querySelector(".egp").textContent
      });
    }));
  }

  search.addEventListener("input",()=>{
    apply();
    clearTimeout(search._t);
    const q=search.value.trim();
    if(q) search._t=setTimeout(()=>track("SEARCH",{query:q,screen_size:active,results:count.textContent}),800);
  });

  rate.addEventListener("input",()=>{
    const rv=Math.max(parseFloat(rate.value)||55,0.01);
    localStorage.setItem(RATE_KEY,String(rv));
    recalcPrices();
    clearTimeout(rate._t);
    rate._t=setTimeout(()=>track("RATE CHANGE",{usd_rate:rate.value}),900);
  });

  // Keep the embedded table as a fallback in case Google Sheet fetch is unavailable.
  const fallbackRows=[...tbody.querySelectorAll("tr")];
  products=fallbackRows.map(r=>({
    model:r.dataset.model,
    size:r.dataset.size,
    part_number:r.dataset.pn,
    ean:r.dataset.ean,
    usd:parseFloat(r.dataset.usd)||0
  }));
  rows=fallbackRows;
  renderFilters();
  recalcPrices();
  apply();
  bindRowTracking();

  try{
    const res=await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const csv=await res.text();
    const live=normalize(parseCSV(csv));
    if(live.length){
      products=live;
      renderRows();
      renderFilters();
      recalcPrices();
      apply();
      sourceStatus.textContent="Live from Published Google Sheet";
      sourceStatus.parentElement.querySelector("b").style.color="#64dfb6";
    }else{
      throw new Error("No valid rows");
    }
  }catch(e){
    sourceStatus.textContent="Using embedded fallback — publish/share the Google Sheet to enable live updates";
  }

  setTimeout(()=>track("PAGE VIEW",{page:location.href,rate:rate.value,source:sourceStatus.textContent}),500);
})();
</script>
</body>
</html>
