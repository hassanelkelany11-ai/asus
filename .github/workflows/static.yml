<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASUS Monitor Market Price List — Egypt</title>
<style>
:root{--bg:#05080d;--panel:#0a0f15;--line:#27313c;--text:#f7f9fc;--muted:#7f8997;--accent:#58d9ff;--good:#64dfb6;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#07111c 0,#05080d 270px);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
.shell{max-width:1500px;margin:auto;padding:28px 24px 60px}
.header{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;color:#9fefff;font-weight:850;letter-spacing:.2em;font-size:13px}
.brandIcon{width:42px;height:42px;border:1px solid #2e6679;display:grid;place-items:center}
h1{font-size:clamp(34px,4.8vw,60px);margin:22px 0 8px;line-height:1;letter-spacing:-.045em}
.sub{color:var(--muted)}
.rate{min-width:265px;background:#090e14;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rate label{display:block;color:#6f7a88;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.rateLine{display:flex;align-items:center;gap:8px;font-weight:800}
.rate input{width:90px;background:#111821;border:1px solid #35404d;color:white;border-radius:8px;padding:8px 10px;font-size:18px;font-weight:800}
.searchArea{margin-top:26px}
.searchWrap{position:relative}
.searchWrap span{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#667180;font-size:22px}
.search{width:100%;height:60px;background:#080d13;border:1px solid #2b3541;border-radius:10px;color:white;padding:0 18px 0 52px;font-size:17px;outline:none}
.search:focus{border-color:#467789;box-shadow:0 0 0 3px rgba(88,217,255,.08)}
.filtersRow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.filtersLabel{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7c8795;text-transform:uppercase}
.filters{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 0}
.filter{white-space:nowrap;border:1px solid var(--line);background:#0a0f15;color:#9aa5b2;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}
.filter.active{background:rgba(88,217,255,.10);color:#e1f9ff;border-color:#3d7b91}
.filter small{opacity:.6;margin-left:6px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;color:#7f8997;font-size:13px}
.sheetHead{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0 9px}
.sheetTitle{font-size:18px;font-weight:850}
.live{color:#7f8997;font-size:12px}
.live b{color:var(--good)}
.tableWrap{border:1px solid #34404d;border-radius:9px;background:#070b10;overflow:auto;max-height:72vh}
table{width:100%;min-width:1080px;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:10;background:#151c25;color:#a4afbd;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:left;padding:13px 14px;border-right:1px solid #34404d;border-bottom:1px solid #42505f;white-space:nowrap}
tbody td{padding:12px 14px;border-right:1px solid #1b232c;border-bottom:1px solid #1b232c;background:#090d12;color:#b8c2ce;white-space:nowrap}
tbody tr:nth-child(even) td{background:#0b1016}
tbody tr:hover td{background:#101923} tbody tr{cursor:pointer}
.rownum{width:52px;text-align:center!important;color:#6e7a88!important;font-family:ui-monospace,monospace}
.modelCell{font-weight:850;color:#f7f9fc}
.sizeCell{color:#80dff8;font-weight:800}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#96a2b0}
.price{text-align:right!important;font-variant-numeric:tabular-nums;font-weight:800}
.egp{color:white}
.hiddenRow{display:none}
.footer{margin-top:12px;color:#667281;font-size:12px;line-height:1.7}
@media(max-width:760px){
  .shell{padding:20px 12px 48px}
  h1{font-size:40px}
  .rate{width:100%}
  .search{height:58px}
  .filtersRow{align-items:flex-start}
  .filters{width:100%}
  .tableWrap{max-height:68vh}
  table{min-width:980px}
  thead th:first-child,tbody td:first-child{position:sticky;left:0;z-index:7;background:#0a0f15}
  thead th:first-child{z-index:13;background:#151c25}
  thead th:nth-child(2),tbody td:nth-child(2){position:sticky;left:52px;z-index:6;background:#0a0f15;min-width:190px}
  thead th:nth-child(2){z-index:12;background:#151c25}
}
</style>
</head>
